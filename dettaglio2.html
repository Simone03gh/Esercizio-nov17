<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smartwatch</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="miocss.css">
</head>
<body>
    <div class="container">
        <p class="mt-3"><a href="index.html">Torna al catalogo</a></p>

        <div class="row mt-4">
            <div class="col-md-6 mb-4">
                <img src="https://data.gioiapura.it/imgprodotto/orologio-smartwatch-smarty-unisex-sw071a-sw071a_814538_zoom.jpg" class="img-thumbnail" alt="Smartwatch">
            </div>
            <div class="col-md-6">
                <h1>Smartwatch</h1>
                <p class="lead">Orologio da polso con funzioni digitali.</p>
                <h2 class="text-success">&euro; 129,00</h2>
                <form action="carrello.jsp" method="post" class="mt-3">
                    <fieldset class="border border-primary p-3">
                        <legend>Acquista</legend>
                        <input type="hidden" name="articolo" value="2">
                        <label for="colore-smartwatch">Colore:</label>
                        <select id="colore-smartwatch" name="colore">
                            <option value="nero">Nero</option>
                            <option value="argento">Argento</option>
                            <option value="rosa">Rosa</option>
                        </select>
                        <br><br>
                        <label for="quantita-smartwatch">Quantità:</label>
                        <input id="quantita-smartwatch" type="number" name="quantita" min="1" max="10" value="1">
                        <br><br>
                        <button type="submit" class="btn btn-primary">Compra</button>
                    </fieldset>
                </form>
            </div>
        </div>

        <div class="row mt-4 mb-4">
            <div class="col-12">
                <h3>Informazioni</h3>
                <table class="scheda">
                    <tr>
                        <th>Prodotto</th>
                        <td>Smartwatch</td>
                    </tr>
                    <tr>
                        <th>Categoria</th>
                        <td>Orologi</td>
                    </tr>
                    <tr>
                        <th>Prezzo</th>
                        <td>&euro; 129,00</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
